services:
  web:
    image: nginx:stable-alpine
    restart: unless-stopped

    ports:
      - "${KOLA_BIND_IP:-127.0.0.1}:${KOLA_HTTP_PORT:-18080}:80"

    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

    security_opt:
      - no-new-privileges:true
